# 판정 임계값의 단일 원본
#
# 이 파일이 사람이 편집하는 유일한 곳입니다. `npm run emit:thresholds` 가
# src/lib/thresholds.generated.ts 를 다시 씁니다. 브라우저는 생성된 TS만 읽고
# YAML을 파싱하지 않습니다. 어긋나면 `npm run test:analysis` 가 실패합니다.
#
# 언어 중립 포맷인 이유: 같은 값을 쓰는 다른 구현(Python 등)이 pyyaml 로 그대로
# 읽어야 하기 때문입니다. TS 상수로 두면 그쪽에서 숫자를 손으로 옮겨 적게 되고,
# 그 순간 두 판정이 조용히 갈라집니다.
#
# label 과 source 는 화면의 "판정 근거" 카드에 그대로 나갑니다. 여기에 키 이름이나
# 함수 이름을 쓰지 마세요 — 읽는 사람은 코드를 보지 않습니다.
#
# validation_status — 값의 근거가 어디까지인지. 화면에 그대로 표시됩니다.
#   literature  보고된 러닝 측정 범위를 반영. 특정 논문 한 편을 인용하지는 않음
#   derived     literature 값에서 계산으로 유도
#   convention  현장에서 널리 쓰이는 관행. 이 프로젝트가 데이터셋으로 검증하지 않음
#   internal    이 프로젝트가 정하고 자체 픽스처로만 확인
#   withheld    러닝 기준이 없음. 이 값에 걸린 판정은 표시하지 않고 보류
#
# withheld 는 라벨이 아니라 동작입니다. thresholds.ts 의 isPublishable 이 false 를
# 돌려주고, 그 값에 의존하는 판정은 숫자 대신 "판정 보류"로 나갑니다. 러닝에서
# 검증된 적 없는 경계로 사용자에게 결론을 주지 않기 위한 장치입니다.
#
# unit — deg(부호 있는 각도) · deg_abs(크기 한계) · s · BW · score · ratio

version: 2

thresholds:
  foot_strike_rearfoot_max_deg:
    label: "리어풋 경계"
    value: -8
    unit: "deg"
    applies_to: "running"
    source: "첫 접지 프레임에서 뒤꿈치가 발가락보다 이만큼 낮으면 뒤꿈치부터 닿은 것으로 봅니다. 발 경사각 ±8°를 주법 경계로 쓰는 현장 관행입니다."
    validation_status: "convention"
    note: "경계 포함. 정확히 -8° 는 리어풋. 공개 데이터셋과 대조한 적이 없어 literature 로 올리지 않았습니다."

  foot_strike_forefoot_min_deg:
    label: "포어풋 경계"
    value: 8
    unit: "deg"
    applies_to: "running"
    source: "같은 관행의 반대쪽 경계입니다. 발가락이 뒤꿈치보다 이만큼 낮으면 앞꿈치부터 닿은 것으로 봅니다."
    validation_status: "convention"
    note: "경계 포함. 정확히 +8° 는 포어풋. 두 경계 사이는 미드풋입니다."

  foot_strike_max_plausible_deg:
    label: "발 각도 판정 한계"
    value: 40
    unit: "deg_abs"
    applies_to: "running"
    source: "달리기에서 발이 지면에 대해 이보다 크게 기울어 닿지는 않습니다. 넘으면 발이 아니라 뒤꿈치·발가락 랜드마크 중 하나가 틀린 경우이므로 판정을 포기합니다."
    validation_status: "internal"
    note: "판정을 포기할 뿐, 반력과 접지 시간은 그대로 계산합니다."

  side_view_max_profile_ratio:
    label: "옆모습 인정 한계"
    value: 0.14
    unit: "ratio"
    applies_to: "camera"
    source: "어깨·엉덩이 폭을 신장으로 나눈 값입니다. 옆에서 찍으면 작고 정면으로 갈수록 커집니다. 이보다 크면 정면·사선으로 보고 발 각도 주법 판정을 하지 않습니다."
    validation_status: "internal"
    note: "정면으로 판정되면 대신 좌우 정렬(과내전·외전) 쪽을 봅니다."

  min_subject_height_ratio:
    label: "사람 크기 최소"
    value: 0.2
    unit: "ratio"
    applies_to: "camera"
    source: "사람이 화면 높이에서 차지하는 비율입니다. 이보다 작으면 접지 프레임의 픽셀 오차가 접지 시간을 좌우해 버립니다."
    validation_status: "internal"
    note: "미달이면 접지·체공·페이스를 아예 표시하지 않고 재촬영을 권합니다."

  min_detected_ratio_fair:
    label: "자세 추적 · 경고선"
    value: 0.8
    unit: "ratio"
    applies_to: "tracking"
    source: "자세가 잡힌 프레임 비율입니다. 이보다 낮으면 놓친 착지가 생기므로 경고를 붙입니다."
    validation_status: "internal"
    note: "숫자는 계속 표시합니다."

  min_detected_ratio_publish:
    label: "자세 추적 · 표시 중단선"
    value: 0.75
    unit: "ratio"
    applies_to: "tracking"
    source: "경고선보다 더 낮은, 숫자를 아예 내지 않는 선입니다. 불확실한 영상에서 임의의 수치를 내는 것보다 재촬영이 안전합니다."
    validation_status: "internal"
    note: "미달이면 품질 poor."

  min_cadence_consistency_fair:
    label: "착지 간격 고름 · 경고선"
    value: 0.55
    unit: "ratio"
    applies_to: "tracking"
    source: "전형 착지 간격의 ±30% 안에 들어온 간격의 비율입니다. 낮으면 일부 착지를 놓쳤다는 뜻입니다."
    validation_status: "internal"
    note: "숫자는 계속 표시합니다."

  min_cadence_consistency_publish:
    label: "착지 간격 고름 · 표시 중단선"
    value: 0.45
    unit: "ratio"
    applies_to: "tracking"
    source: "경고선보다 더 낮은, 숫자를 아예 내지 않는 선입니다."
    validation_status: "internal"
    note: "미달이면 품질 poor."

  min_contact_s:
    label: "접지 시간 하한"
    value: 0.06
    unit: "s"
    applies_to: "running"
    source: "보고된 러닝 접지 시간의 하한 근처입니다. 스프린트가 약 0.08 s 이고, 그보다 짧게 잡힌 구간은 접지가 아니라 추적 끊김입니다."
    validation_status: "literature"
    note: "여유를 두어 0.08 보다 낮게 잡았습니다."

  max_contact_s:
    label: "접지 시간 상한"
    value: 0.4
    unit: "s"
    applies_to: "running"
    source: "보고된 러닝 접지 시간의 상한 근처입니다. 느린 조깅이 약 0.3 s 이고, 이보다 길면 달리기가 아니라 걷기이거나 추적이 멈춘 구간입니다."
    validation_status: "literature"
    note: "특정 논문 한 편을 인용하지는 않았습니다."

  min_step_s:
    label: "착지 간격 하한"
    value: 0.15
    unit: "s"
    applies_to: "running"
    source: "케이던스 400 spm 에 해당합니다. 사람이 낼 수 없는 간격을 걸러냅니다."
    validation_status: "derived"
    note: "60 / 0.15 = 400 spm."

  max_step_s:
    label: "착지 간격 상한"
    value: 0.7
    unit: "s"
    applies_to: "running"
    source: "케이던스 86 spm 에 해당합니다. 이보다 긴 간격은 중간에 착지를 놓친 것으로 봅니다."
    validation_status: "derived"
    note: "60 / 0.7 ≈ 86 spm."

  stance_edge_allowance_s:
    label: "접지 앞뒤 보정"
    value: 0.04
    unit: "s"
    applies_to: "running"
    source: "발 높이로 접지를 자르면 뒤꿈치가 굴러 들어오는 구간과 발가락이 떨어지는 구간이 잘려 나갑니다. 그만큼을 되돌려 더합니다."
    validation_status: "internal"
    note: "이 보정이 없으면 접지가 짧게 측정되어 반력이 과대평가됩니다. 자체 픽스처로만 확인했습니다."

  peak_grf_min_bw:
    label: "추정 반력 하한"
    value: 1.05
    unit: "BW"
    applies_to: "running"
    source: "걷기의 최대 수직 지면반력이 체중의 약 1.05~1.2배입니다. 달리기 추정치가 그보다 낮게 나올 수는 없습니다."
    validation_status: "literature"
    note: "곡선이 아래로 벗어나는 것을 막습니다."

  peak_grf_max_bw:
    label: "추정 반력 상한"
    value: 4.5
    unit: "BW"
    applies_to: "running"
    source: "보고된 스프린트 최대 수직 지면반력(약 3.7 BW)에 여유를 둔 값입니다."
    validation_status: "literature"
    note: "접지 시간이 0 에 가까워질 때 곡선이 발산하는 것을 막습니다."

  load_score_moderate_min:
    label: "충격 점수 · 보통 시작"
    value: 25
    unit: "score"
    applies_to: "scoring"
    source: "반력·부하율·무릎 굽힘을 합친 0~100 점의 구간 경계입니다. 이 앱의 휴리스틱입니다."
    validation_status: "internal"
    note: "부상률 같은 외부 결과와 대조한 적이 없습니다. 같은 사람의 회차 간 비교용입니다."

  load_score_elevated_min:
    label: "충격 점수 · 주의 시작"
    value: 45
    unit: "score"
    applies_to: "scoring"
    source: "같은 휴리스틱의 다음 구간 경계입니다."
    validation_status: "internal"
    note: "외부 검증 없음."

  load_score_high_min:
    label: "충격 점수 · 높음 시작"
    value: 65
    unit: "score"
    applies_to: "scoring"
    source: "같은 휴리스틱의 다음 구간 경계입니다."
    validation_status: "internal"
    note: "외부 검증 없음."

  load_score_severe_min:
    label: "충격 점수 · 매우 높음 시작"
    value: 80
    unit: "score"
    applies_to: "scoring"
    source: "같은 휴리스틱의 마지막 구간 경계입니다."
    validation_status: "internal"
    note: "외부 검증 없음."
